<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="24" fill="url(#bg)"/>

  <!-- Ant icon (left side) -->
  <g transform="translate(80,140) scale(0.45)">
    <!-- Antennae -->
    <line x1="-36" y1="-80" x2="-66" y2="-140" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
    <line x1="36" y1="-80" x2="66" y2="-140" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-70" cy="-144" r="10" fill="#4ade80"/>
    <circle cx="70" cy="-144" r="10" fill="#4ade80"/>

    <!-- Head -->
    <ellipse cx="0" cy="-52" rx="48" ry="40" fill="#e94560"/>
    <circle cx="-16" cy="-60" r="9" fill="#1a1a2e"/>
    <circle cx="16" cy="-60" r="9" fill="#1a1a2e"/>
    <circle cx="-14" cy="-62" r="3.5" fill="#fff"/>
    <circle cx="18" cy="-62" r="3.5" fill="#fff"/>

    <!-- Thorax -->
    <ellipse cx="0" cy="32" rx="38" ry="42" fill="#e94560"/>

    <!-- Abdomen -->
    <ellipse cx="0" cy="140" rx="58" ry="66" fill="#e94560"/>
    <ellipse cx="0" cy="115" rx="50" ry="7" fill="#c4314e" opacity="0.5"/>
    <ellipse cx="0" cy="140" rx="54" ry="7" fill="#c4314e" opacity="0.5"/>
    <ellipse cx="0" cy="165" rx="46" ry="7" fill="#c4314e" opacity="0.5"/>

    <!-- Legs left -->
    <line x1="-30" y1="16" x2="-96" y2="-20" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="-96" y1="-20" x2="-120" y2="16" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="-34" y1="40" x2="-106" y2="48" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="-106" y1="48" x2="-130" y2="84" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="-32" y1="64" x2="-100" y2="104" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="-100" y1="104" x2="-124" y2="146" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>

    <!-- Legs right -->
    <line x1="30" y1="16" x2="96" y2="-20" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="96" y1="-20" x2="120" y2="16" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="34" y1="40" x2="106" y2="48" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="106" y1="48" x2="130" y2="84" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="32" y1="64" x2="100" y2="104" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
    <line x1="100" y1="104" x2="124" y2="146" stroke="#e94560" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="220" y="155" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="96" fill="#e94560" letter-spacing="4">ANTHILL</text>

  <!-- Tagline -->
  <text x="224" y="200" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4ade80" letter-spacing="6">AUTONOMOUS INTELLIGENCES</text>

  <!-- Subtle R2 badge -->
  <text x="224" y="235" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#666" letter-spacing="2">POWERED BY REALITY2</text>
</svg>
