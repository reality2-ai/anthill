<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <rect width="800" height="280" rx="24" fill="#1a1a2e"/>

  <!-- Simple mound -->
  <path d="M30,195 Q100,70 170,195" fill="#e94560"/>

  <!-- Entrance -->
  <ellipse cx="100" cy="193" rx="14" ry="9" fill="#1a1a2e"/>

  <!-- Lightbulb above the mound -->
  <!-- Bulb glass -->
  <path d="M86,52 Q78,35 88,18 Q100,6 112,18 Q122,35 114,52" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <!-- Bulb base -->
  <line x1="88" y1="52" x2="112" y2="52" stroke="#4ade80" stroke-width="2"/>
  <line x1="90" y1="56" x2="110" y2="56" stroke="#4ade80" stroke-width="2"/>
  <line x1="92" y1="60" x2="108" y2="60" stroke="#4ade80" stroke-width="2"/>
  <!-- Filament glow -->
  <circle cx="100" cy="36" r="6" fill="#4ade80" opacity="0.3"/>
  <circle cx="100" cy="36" r="3" fill="#4ade80" opacity="0.6"/>

  <!-- Light rays -->
  <line x1="100" y1="6" x2="100" y2="-2" stroke="#4ade80" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="72" y1="18" x2="66" y2="12" stroke="#4ade80" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="128" y1="18" x2="134" y2="12" stroke="#4ade80" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="68" y1="40" x2="60" y2="38" stroke="#4ade80" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="132" y1="40" x2="140" y2="38" stroke="#4ade80" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- Text -->
  <text x="210" y="148" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="92" fill="#e94560" letter-spacing="3">ANTHILL</text>
  <text x="214" y="193" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#4ade80" letter-spacing="5">AUTONOMOUS INTELLIGENCES</text>
  <text x="214" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555" letter-spacing="2">POWERED BY REALITY2</text>
</svg>
