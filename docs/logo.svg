<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <rect width="680" height="280" rx="24" fill="#1a1a2e"/>

  <!-- Simple mound -->
  <path d="M30,195 Q100,70 170,195" fill="#e94560"/>

  <!-- Entrance -->
  <ellipse cx="100" cy="193" rx="14" ry="9" fill="#1a1a2e"/>

  <!-- Lightbulb sitting on the mound peak (peak is ~y132) -->
  <!-- Bulb glass -->
  <path d="M90,132 Q83,118 91,106 Q100,97 109,106 Q117,118 110,132" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <!-- Bulb base merges with mound -->
  <line x1="92" y1="132" x2="108" y2="132" stroke="#4ade80" stroke-width="2"/>
  <!-- Filament glow -->
  <circle cx="100" cy="118" r="5" fill="#4ade80" opacity="0.3"/>
  <circle cx="100" cy="118" r="2.5" fill="#4ade80" opacity="0.6"/>

  <!-- Light rays -->
  <line x1="100" y1="92" x2="100" y2="84" stroke="#4ade80" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="79" y1="100" x2="73" y2="94" stroke="#4ade80" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="121" y1="100" x2="127" y2="94" stroke="#4ade80" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Text -->
  <text x="210" y="148" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="92" fill="#e94560" letter-spacing="3">ANTHILL</text>
  <text x="214" y="193" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#4ade80" letter-spacing="5">AUTONOMOUS INTELLIGENCES</text>
  <text x="214" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555" letter-spacing="2">POWERED BY REALITY2</text>
</svg>
