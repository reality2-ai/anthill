<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="hill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#a3213e"/>
    </linearGradient>
    <linearGradient id="ground" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="24" fill="url(#bg)"/>

  <!-- Ground line -->
  <rect x="20" y="178" width="160" height="82" rx="4" fill="url(#ground)"/>

  <!-- Hill mound -->
  <path d="M30,178 Q100,60 170,178" fill="url(#hill)"/>

  <!-- Entrance -->
  <ellipse cx="100" cy="176" rx="18" ry="12" fill="#0a0a1a"/>

  <!-- Underground chambers (cross-section) -->
  <!-- Tunnel from entrance -->
  <line x1="100" y1="186" x2="100" y2="210" stroke="#444" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="210" x2="65" y2="225" stroke="#444" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="210" x2="135" y2="230" stroke="#444" stroke-width="3" stroke-linecap="round"/>

  <!-- Chamber 1 (left) -->
  <ellipse cx="55" cy="235" rx="20" ry="12" fill="#1e3a2e" stroke="#4ade80" stroke-width="1.5"/>
  <!-- Chamber 2 (right) -->
  <ellipse cx="145" cy="240" rx="20" ry="12" fill="#1e3a2e" stroke="#4ade80" stroke-width="1.5"/>
  <!-- Chamber 3 (center deep) -->
  <line x1="100" y1="210" x2="100" y2="245" stroke="#444" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="100" cy="252" rx="16" ry="10" fill="#2e1a1a" stroke="#e94560" stroke-width="1.5"/>

  <!-- Small ants on the mound -->
  <circle cx="75" cy="140" r="3" fill="#e94560"/>
  <circle cx="72" cy="137" r="2" fill="#e94560"/>
  <circle cx="120" cy="125" r="3" fill="#e94560"/>
  <circle cx="117" cy="122" r="2" fill="#e94560"/>
  <circle cx="95" cy="108" r="3" fill="#e94560"/>
  <circle cx="92" cy="105" r="2" fill="#e94560"/>

  <!-- Signal waves from top -->
  <path d="M85,72 Q100,62 115,72" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
  <path d="M76,62 Q100,48 124,62" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
  <path d="M67,52 Q100,34 133,52" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.3"/>

  <!-- Text -->
  <text x="220" y="145" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="90" fill="#e94560" letter-spacing="3">ANTHILL</text>

  <!-- Tagline -->
  <text x="224" y="190" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#4ade80" letter-spacing="5">AUTONOMOUS INTELLIGENCES</text>

  <!-- R2 badge -->
  <text x="224" y="225" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#666" letter-spacing="2">POWERED BY REALITY2</text>
</svg>
