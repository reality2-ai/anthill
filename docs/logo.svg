<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <rect width="800" height="280" rx="24" fill="#1a1a2e"/>

  <!-- Simple mound -->
  <path d="M30,195 Q100,70 170,195" fill="#e94560"/>

  <!-- Entrance -->
  <ellipse cx="100" cy="193" rx="14" ry="9" fill="#1a1a2e"/>

  <!-- Lightbulb sitting on top of the mound -->
  <!-- Bulb glass -->
  <path d="M88,72 Q80,56 90,42 Q100,32 110,42 Q120,56 112,72" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <!-- Bulb base -->
  <line x1="90" y1="72" x2="110" y2="72" stroke="#4ade80" stroke-width="2"/>
  <line x1="92" y1="76" x2="108" y2="76" stroke="#4ade80" stroke-width="2"/>
  <!-- Filament glow -->
  <circle cx="100" cy="56" r="6" fill="#4ade80" opacity="0.3"/>
  <circle cx="100" cy="56" r="3" fill="#4ade80" opacity="0.6"/>

  <!-- Light rays -->
  <line x1="100" y1="28" x2="100" y2="20" stroke="#4ade80" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="76" y1="38" x2="70" y2="32" stroke="#4ade80" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="124" y1="38" x2="130" y2="32" stroke="#4ade80" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Text -->
  <text x="210" y="148" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="92" fill="#e94560" letter-spacing="3">ANTHILL</text>
  <text x="214" y="193" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#4ade80" letter-spacing="5">AUTONOMOUS INTELLIGENCES</text>
  <text x="214" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555" letter-spacing="2">POWERED BY REALITY2</text>
</svg>
