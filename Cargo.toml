[package]
name = "anthill"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Anthill — a colony for ANTS (Autonomous iNTelligenceS)"
repository = "https://github.com/reality2-ai/anthill"

[[bin]]
name = "anthill"
path = "src/main.rs"

[dependencies]
# Vendored R2 crates
r2-engine = { path = "crates/r2-engine", features = ["alloc", "std"] }
r2-wire   = { path = "crates/r2-wire" }
r2-fnv    = { path = "crates/r2-fnv" }
r2-cbor   = { path = "crates/r2-cbor" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Telegram
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }

# PTY
portable-pty = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP client (for Claude API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Web server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Error handling
anyhow = "1"

[workspace]
members = [
    ".",
    "crates/r2-engine",
    "crates/r2-wire",
    "crates/r2-fnv",
    "crates/r2-cbor",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
