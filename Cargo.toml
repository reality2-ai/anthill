[package]
name = "anthill"
version = "0.9.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Anthill — a colony for ANTS (Autonomous iNTelligenceS)"
repository = "https://github.com/reality2-ai/anthill"

[[bin]]
name = "anthill"
path = "src/main.rs"

[dependencies]
# Vendored R2 crates
r2-engine = { path = "crates/r2-engine", features = ["alloc", "std"] }
r2-wire   = { path = "crates/r2-wire" }
r2-fnv    = { path = "crates/r2-fnv" }
r2-cbor   = { path = "crates/r2-cbor" }
r2-trust  = { path = "crates/r2-trust", features = ["std"] }
r2-transport = { path = "crates/r2-transport", features = ["std"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Telegram
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP client (for Claude API and AI backends)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async trait (for AI backend abstraction)
async-trait = "0.1"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Web server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# WebSocket client (for Slack Socket Mode)
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Cryptography
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
rand = "0.8"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"

# Knowledge graph
petgraph = { version = "0.6", features = ["serde-1"] }

# CBOR encoding for knowledge store (Phase 2)
ciborium = "0.2"

# QR code generation (for key export)
qrcode = "0.14"

# UUID generation for knowledge graph snapshots
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1.3"

# Process management (Unix process group signals)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Error handling
anyhow = "1"

[workspace]
members = [
    ".",
    "crates/r2-engine",
    "crates/r2-wire",
    "crates/r2-fnv",
    "crates/r2-cbor",
    "crates/r2-trust",
    "crates/r2-transport",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
