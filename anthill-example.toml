# anthill configuration
#
# Copy to anthill.toml and fill in your values.
# anthill.toml is gitignored (contains secrets).
#
# Mode: "raw" | "ai" | "claude"
#   raw    — persistent PTY, raw terminal output (default)
#   ai     — NL → shell command → summarised output (needs anthropic_api_key)
#   claude — runs `claude -p` per message, clean text output
mode = "raw"

[telegram]
# Bot token from @BotFather (or set TELOXIDE_TOKEN env var).
token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"

# Restrict to these chat IDs. Empty = allow all.
# Find your chat ID by messaging @userinfobot on Telegram.
# allow = [123456789, 987654321]

[raw]
# Shell to spawn in raw/ai modes.
shell = "/bin/bash"

[ai]
# Claude model for AI mediation mode.
model = "claude-sonnet-4-20250514"

# API key (or set ANTHROPIC_API_KEY env var).
# anthropic_api_key = "sk-ant-..."

[claude]
# Working directory for `claude -p`.
# Defaults to current directory if not set.
# working_dir = "/home/user/my-project"

# Directory for per-user memory files ({chat_id}.md).
# Relative to working_dir, or absolute. Default: "memory"
memory_dir = "memory"

# Optional system prompt prepended to every Claude invocation.
# system_prompt = "You are a helpful assistant managing a Linux server."

# Directory for cloned git repositories.
# Relative to working_dir. Default: "repos"
repos_dir = "repos"

# Allow Claude to run commands without permission prompts.
# Required for non-interactive mode. Only enable if access is
# restricted via telegram.allow.
skip_permissions = false

# Auto-backup: commit working dir changes to git periodically.
# Set to 0 to disable. Default: 0
backup_interval_hours = 0

# Git remote to push backups to. Empty = local commits only.
# backup_remote = "origin"
